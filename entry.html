<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Chandu Balagani — Python Developer"
    >

    <meta
        name="author"
        content="Chandu Balagani"
    >

    <title>
        Chandu Balagani | Multiverse
    </title>


    <!-- =========================================
         FONT
    ========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================
         CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="entry.css"
    >

</head>


<body>


<main class="multiverse">


    <!-- =========================================
         STAR FIELD
    ========================================== -->

    <div
        class="stars"
        aria-hidden="true"
    ></div>


    <div
        class="stars stars-two"
        aria-hidden="true"
    ></div>


    <div
        class="stars stars-three"
        aria-hidden="true"
    ></div>


    <!-- =========================================
         AMBIENT LIGHT
    ========================================== -->

    <div
        class="ambient-glow glow-one"
        aria-hidden="true"
    ></div>


    <div
        class="ambient-glow glow-two"
        aria-hidden="true"
    ></div>


    <!-- =========================================
         CURSOR LIGHT
    ========================================== -->

    <div
        id="cursor-glow"
        class="cursor-glow"
        aria-hidden="true"
    ></div>


    <!-- =========================================
         MULTIVERSE
    ========================================== -->

    <div
        class="universe"
        aria-hidden="true"
    >


        <!-- Orbit rings -->

        <div
            class="universe-ring ring-one"
        ></div>


        <div
            class="universe-ring ring-two"
        ></div>


        <div
            class="universe-ring ring-three"
        ></div>


        <!-- Universe core -->

        <div
            class="universe-core"
        >

            <div
                class="core-light"
            ></div>

        </div>


        <!-- =====================================
             PARTICLES
        ====================================== -->

        <span
            class="particle particle-one"
        ></span>

        <span
            class="particle particle-two"
        ></span>

        <span
            class="particle particle-three"
        ></span>

        <span
            class="particle particle-four"
        ></span>

        <span
            class="particle particle-five"
        ></span>

        <span
            class="particle particle-six"
        ></span>

        <span
            class="particle particle-seven"
        ></span>

        <span
            class="particle particle-eight"
        ></span>


    </div>


    <!-- =========================================
         MAIN TEXT
    ========================================== -->

    <section
        class="entry-content"
    >


        <h1>

            <span class="first-name">
                CHANDU
            </span>


            <span class="last-name">
                BALAGANI
            </span>

        </h1>


        <p
            class="entry-role"
        >
            PYTHON DEVELOPER
        </p>


        <!-- =====================================
             ENTER BUTTON
        ====================================== -->

        <button
            id="enter-button"
            class="enter-button"
            type="button"
        >

            <span>
                ENTER THE MULTIVERSE
            </span>


            <strong>
                ↗
            </strong>

        </button>


    </section>


    <!-- =========================================
         TECHNOLOGY LABELS
    ========================================== -->

    <div
        class="tech-orbit"
        aria-hidden="true"
    >


        <span
            class="tech tech-python"
        >
            PYTHON
        </span>


        <span
            class="tech tech-django"
        >
            DJANGO
        </span>


        <span
            class="tech tech-sql"
        >
            SQL
        </span>


        <span
            class="tech tech-web"
        >
            WEB
        </span>


    </div>


    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer
        class="entry-footer"
    >

        <span>
            2026
        </span>


        <span>
            BUILDING • LEARNING • CREATING
        </span>

    </footer>


    <!-- =========================================
         TRANSITION
    ========================================== -->

    <div
        id="transition"
        class="transition"
    ></div>


</main>


<!-- =============================================
     JAVASCRIPT
============================================== -->

<script
    src="entry.js"
></script>


</body>

</html>
